<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:" />
    <title>clots</title>
    <style>
      /* The same font as the web client, so the app does not change its face after the connect page. */
      @font-face {
        font-family: "Allo";
        src: url("./AlloVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0c0d;
        color: #f4f4f5;
        font-family: "Allo", -apple-system, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-variation-settings: "ROND" 100;
        -webkit-app-region: drag;
      }
      form {
        width: 22rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        -webkit-app-region: no-drag;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        text-align: center;
      }
      p {
        margin: 0 0 0.75rem;
        color: #8b8b93;
        font-size: 0.875rem;
        text-align: center;
        line-height: 1.4;
      }
      input,
      button {
        font: inherit;
        border-radius: 999px;
        padding: 0.75rem 1.1rem;
      }
      input {
        border: 1px solid #262628;
        background: #131314;
        color: inherit;
        outline: none;
      }
      input:focus {
        border-color: #8b8b93;
      }
      button {
        border: 0;
        background: #f4f4f5;
        color: #0c0c0d;
        font-weight: 600;
      }
      #error {
        color: #fb923c;
      }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>Connect to clots</h1>
      <p>Enter the address that <code>clots up</code> printed on your server.</p>
      <p id="error" hidden></p>
      <input id="url" placeholder="clots.your-tailnet.ts.net" autofocus required />
      <button type="submit">Connect</button>
    </form>
    <script>
      const query = new URLSearchParams(location.search);
      const input = document.getElementById("url");
      const error = document.getElementById("error");
      input.value = query.get("url") ?? "";

      if (query.has("error")) {
        error.hidden = false;
        error.textContent = "Cannot reach the server: " + query.get("error");
      }

      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        window.clotsDesktop.connect(input.value.trim());
      });
    </script>
  </body>
</html>
