name: Release

# A maintainer starts a release by hand from the Actions tab. Only people with
# write access to the repository can run it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release

env:
  VERSION: ${{ inputs.version }}

jobs:
  # The server reads its version from the root package.json, so the release commit sets it there.
  prepare:
    # Release only from main, so a release never contains unmerged work.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version such as 1.2.3, without a v or a prerelease suffix."
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Commit the version and tag it
        run: |
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.next
          mv package.json.next package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The first release can match the version that package.json already has.
          if ! git diff --quiet; then
            git commit -am "chore(release): $VERSION"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. The app and the server bundle come from the same runner.
          - runner: macos-15
            app: true
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/sidecar/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      # `clots update` downloads this archive and expects one folder named after the platform inside it.
      - name: Pack the clots bundle
        run: |
          bundle=$(ls dist)
          tar -czf "$bundle.tar.gz" -C dist "$bundle"
      # The app updates itself from the zip and latest-mac.yml. macOS installs an update only into an app
      # with a Developer ID signature, so a build without the Apple secrets, such as in a fork, does not update itself.
      - name: Build the Clots app
        if: matrix.app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run --cwd apps/desktop build
          cd apps/desktop

          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            # notarytool reads the App Store Connect API key from a file.
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key")
            export APPLE_API_KEY="$key"
            unsigned=()
          else
            echo "::warning::The Apple secrets are missing, so the app gets an ad-hoc signature and no notarization."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            unsigned=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi

          bunx electron-builder --mac --publish never -c.extraMetadata.version="$VERSION" "${unsigned[@]}"
          mv release/Clots.dmg release/*.zip release/*.blockmap release/latest-mac.yml ../..
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runner }}
          path: |
            *.tar.gz
            *.dmg
            *.zip
            *.blockmap
            latest-mac.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      # scripts/install.sh checks each download against this file.
      - name: Write the checksums
        run: cd assets && sha256sum * > checksums.txt
      - name: Create the GitHub release
        run: gh release create "v$VERSION" assets/* --title "v$VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
